apiVersion: v1
kind: Service
metadata:
  name: {{ include "gentics-portal.fullname" . }}
  labels:
    {{- include "gentics-portal.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if .Values.service.useHttp2 }}
      appProtocol: h2c
      {{- end }}

  selector:
    {{- include "gentics-portal.selectorLabels" . | nindent 4 }}
